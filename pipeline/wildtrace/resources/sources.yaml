# Registry of open data sources for illegal wildlife trade (IWT) in South & Southeast Asia.
#
# access:
#   api     : machine-readable endpoint, collector implemented
#   rss     : feed, collected by collect/feeds.py
#   bulk    : downloadable file, loader implemented; you download it yourself
#   manual  : public web pages/reports; analyst reads and records cases by hand
#   request : data exists but is shared on request / under agreement
#   private : your own data; never published
#
# `enabled: false` means off by default. `terms` records the licence or terms of use:
# read them before turning a source on. Check the status fields before relying on any source.

sources:
  - id: official
    name: Official enforcement releases (government, customs, police, judiciary)
    url: null
    access: rss
    feed: null
    enabled: true
    role: [enforcement, validation]
    region: global
    terms: "Public releases by government bodies; searched per domain (gov.br, gob.mx, go.id, gov.in, justice.gov, info.gov.hk ...)"
    notes: "Highest source tier. A case with an official source is marked 'Official source'."

  - id: agency_rss
    name: Agency press-release feeds (Hong Kong GovNews, French customs, US Department of Justice)
    url: https://www.info.gov.hk/gia/rss/general_en.xml
    access: rss
    enabled: true
    role: [enforcement, validation]
    region: global
    terms: "Public government releases; derived facts and links only"
    notes: "collect/agency.py AGENCY_FEEDS, daily. Hong Kong history from the public daily index (collect --hk-archive),
      2 s between requests. No feed (checked 2026-10-19): customs.gov.hk, fws.gov, gob.mx/profepa, abf.gov.au, news.navy.lk."

  - id: youtube_news
    name: YouTube enforcement videos
    url: https://www.youtube.com/
    access: scrape
    enabled: true
    role: [enforcement, news]
    region: global
    terms: "Metadata, captions and upload date only; nothing downloaded; never in CI; channel names never published"
    notes: "collect/video.py (yt-dlp, youtube-transcript-api). video_channels: channel ids for the RSS route, none yet."
    video_channels: []

  - id: gdelt
    name: GDELT DOC 2.0 news index
    url: https://www.gdeltproject.org/
    access: api
    enabled: true
    role: [enforcement, news]
    region: global
    terms: "Open; attribution to the GDELT Project"
    notes: "Rolling ~3-month article window; 1 request / 5 s."

  - id: gnews
    name: Google News RSS search
    url: https://news.google.com/
    access: rss
    feed: null
    enabled: true   # turned on by the project owner, 2026-09-22 (--gnews)
    role: [enforcement, news]
    region: [IN, TH, VN, ID, MY, PH, SG]
    terms: "Feed terms: personal, non-commercial use. Opt-in (--gnews); publish derived facts only."

  - id: pib_moefcc
    name: Press Information Bureau (Govt. of India) press releases
    url: https://pib.gov.in/
    access: rss
    feed: https://pib.gov.in/RssMain.aspx?ModId=6&Lang=1&Regid=3
    enabled: false
    country: IN
    kind: official
    role: [enforcement, policy]
    terms: "Government of India public releases"
    notes: "Returns 403 to automated clients (Akamai, Sep 2026). Read releases manually or via a browser-based Agent Reach channel."

  - id: wccb
    name: Wildlife Crime Control Bureau (India)
    url: https://wccb.gov.in/
    access: manual
    enabled: false
    country: IN
    role: [enforcement, alerts, species-lists]
    notes: "Operation reports and alerts. Site did not respond from the build machine (Sep 2026)."

  - id: cites_trade
    name: CITES Trade Database (UNEP-WCMC)
    url: https://trade.cites.org/
    access: bulk
    enabled: true
    role: [legal-trade, demand-supply, seizures-source-I]
    region: global
    terms: "Free for non-commercial use with attribution to CITES Secretariat / UNEP-WCMC"
    notes: "Annual full CSV download (2026.1 in use: 1975 to 2026). Source code 'I' = confiscated/seized specimens. Loader: wildtrace cites <folder> -> web/data/flows.json, the Flows view. That file is shared under CITES's terms, not CC BY."

  - id: virion
    name: VIRION, the Global Virome in One Network (Verena)
    url: https://doi.org/10.5281/zenodo.15643003
    access: bulk
    enabled: true
    role: [zoonoses, host-virus]
    region: global
    terms: "ODbL 1.0; cite Carlson et al. 2022, mBio 13:e02985-21"
    notes: "Host-virus records from GenBank and four literature databases, refreshed on Zenodo. Only PCR/sequencing or isolation counted. Loader: wildtrace zoonoses -> web/data/zoonoses.json (ODbL)."

  - id: who_don
    name: WHO Disease Outbreak News
    url: https://www.who.int/emergencies/disease-outbreak-news
    access: api
    enabled: true
    role: [zoonoses, outbreaks]
    region: global
    terms: "WHO website terms; titles and dates are used to count reports, text is not republished"
    notes: "Public API, 1996 to today. Diseases with an animal reservoir are grouped by how they reach people. Refreshed weekly."

  - id: clover
    name: CLOVER host-pathogen associations (Verena)
    url: https://github.com/viralemergence/clover
    access: bulk
    enabled: false
    role: [zoonoses, host-pathogen]
    terms: "Cite the Zenodo DOI and Gibb et al. 2021"
    notes: "Adds bacteria, helminths, protozoa and fungi, but stops at 2021 and has no pangolin records; kept as a cross-check, not published."

  - id: cites_speciesplus
    name: Species+ / CITES Checklist API
    url: https://api.speciesplus.net/
    access: api
    enabled: false
    role: [taxonomy, legal-status]
    terms: "Free token; attribution required"

  - id: lemis
    name: US Fish & Wildlife Service LEMIS import records
    url: https://doi.org/10.5281/zenodo.14982583
    access: bulk
    enabled: true
    role: [seizures, demand, products]
    region: global
    terms: "CC BY 4.0 (Marshall et al. 2025, Current Biology; Eskew et al. 2020, Scientific Data)"
    notes: "FOIA import records with their fate; disposition S = seized at a US port. Marshall et al. 2025 (Zenodo 14982583): 2000-2022, terrestrial mammals, birds, reptiles, amphibians, arachnids. Eskew et al. 2020 (Zenodo 3565869): 2000-2014, all taxa, used only for classes Marshall does not cover. Genera placed in families with the PMC8579131 GBIF key. Loader: wildtrace lemis <folder> --taxonomy <codebook> -> web/data/lemis.json + lemis_seized_flows.csv (the 'Seized at US ports' evidence in Flows)."

  - id: c4ads_wildleo
    name: C4ADS WildLEO / wildlife seizure database
    url: https://c4ads.org/
    access: request
    enabled: false
    role: [enforcement, seizures]
    notes: "Ivory, rhino horn and pangolin focus; access by agreement."

  - id: unodc_worldwise
    name: UNODC World WISE
    url: https://www.unodc.org/unodc/en/data-and-analysis/wildlife.html
    access: request
    enabled: false
    role: [enforcement, seizures]
    notes: "Record-level data not public; World Wildlife Crime Report gives aggregates."

  - id: traffic_portal
    name: TRAFFIC Wildlife Trade Portal
    url: https://www.wildlifetradeportal.org/
    access: manual
    enabled: false
    role: [enforcement, seizures]
    notes: "Free registration; check terms before any automated use."

  - id: eia_crime_tracker
    name: EIA Global Environmental Crime Tracker
    url: https://eia-international.org/
    access: manual
    enabled: false
    role: [enforcement, seizures, convictions]

  - id: wjc_reports
    name: Wildlife Justice Commission reports
    url: https://wildlifejustice.org/
    access: manual
    enabled: false
    role: [networks, case-reports]
    notes: "Detailed network investigations (SE Asia, Nigeria-Vietnam routes). Good seeds for link charts."

  - id: env_vietnam
    name: Education for Nature Vietnam (ENV) wildlife crime reports
    url: https://env4wildlife.org/
    access: manual
    enabled: false
    country: VN
    role: [enforcement, case-reports]

  - id: indian_kanoon
    name: Indian Kanoon (court judgments)
    url: https://api.indiankanoon.org/
    access: api
    enabled: false
    country: IN
    kind: court
    role: [prosecution, convictions]
    terms: "Paid API token; search 'Wildlife (Protection) Act' + species"
    notes: "Collector stub not yet written. Judgments name accused persons: keep in data/private only."

  - id: gbif
    name: GBIF occurrence API
    url: https://api.gbif.org/v1/
    access: api
    enabled: false
    role: [species-range, context]
    terms: "CC0 / CC-BY per dataset"

  - id: youtube
    name: YouTube search (metadata only)
    url: https://www.youtube.com/
    access: api
    enabled: true   # turned on by the project owner, 2026-09-22 (--youtube)
    role: [online-trade, supply]
    terms: "YouTube Data API terms, or yt-dlp for public metadata. Never publish channel names or contact numbers."

  - id: agent_reach
    name: Agent Reach bridge (web, RSS, Reddit, X, YouTube, ...)
    url: https://github.com/Panniantong/agent-reach
    access: api
    enabled: false
    role: [online-trade, news]
    terms: "MIT tool; each upstream platform keeps its own terms"
    notes: "Uses whatever upstream tools `agent-reach doctor` reports as healthy."

  - id: wcs_owt
    name: OWT labelled set (Python script)
    url: null
    access: private
    enabled: true
    role: [training-data, online-trade]
    notes: "1,274 labelled YouTube listings (trade / irrelevant) loaded by classify/dataset.py; trains the relevance model. Only aggregates are published."
