<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="pipeline-title pipeline-desc" font-family="Geist, 'Segoe UI', system-ui, sans-serif">
  <title id="pipeline-title">How WildTrace turns public reports into cases</title>
  <desc id="pipeline-desc">21,225 public records are screened to 3,713 enforcement reports, merged into 2,206 graded cases, and checked by blind precision audits and a recall test against an independent list (build of 20 October 2026).</desc>
  <defs>
    <marker id="pipeline-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#8a948f"/></marker>
    <marker id="pipeline-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#d6453d"/></marker>
  </defs>
  <rect width="960" height="300" fill="#f7f8f5"/>

  <!-- connectors first, so they sit behind the boxes -->
  <line x1="212" y1="120" x2="268" y2="120" stroke="#8a948f" stroke-width="1.5" marker-end="url(#pipeline-arrow)"/>
  <line x1="452" y1="120" x2="508" y2="120" stroke="#8a948f" stroke-width="1.5" marker-end="url(#pipeline-arrow)"/>
  <line x1="692" y1="120" x2="748" y2="120" stroke="#d6453d" stroke-width="1.5" marker-end="url(#pipeline-arrow-accent)"/>
  <path d="M600 164 V220 H748" fill="none" stroke="#8a948f" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#pipeline-arrow)"/>
  <rect x="616" y="208" width="88" height="20" fill="#f7f8f5"/>
  <text x="660" y="222" text-anchor="middle" font-size="10" font-weight="600" letter-spacing="0.08em" fill="#5b6661">SAMPLED</text>

  <!-- 1 sources -->
  <rect x="28" y="76" width="184" height="88" rx="6" fill="#fff" stroke="#c9d0cc"/>
  <rect x="40" y="88" width="62" height="18" rx="2" fill="#eef1ef"/>
  <text x="71" y="101" text-anchor="middle" font-size="10" font-weight="600" letter-spacing="0.06em" fill="#5b6661">SOURCES</text>
  <text x="40" y="132" font-size="22" font-weight="650" fill="#0f1a17">21,225</text>
  <text x="40" y="152" font-size="11.5" fill="#5b6661" font-family="'Geist Mono', Consolas, monospace">news, government, video</text>

  <!-- 2 screen -->
  <rect x="268" y="76" width="184" height="88" rx="6" fill="#fff" stroke="#c9d0cc"/>
  <rect x="280" y="88" width="56" height="18" rx="2" fill="#eef1ef"/>
  <text x="308" y="101" text-anchor="middle" font-size="10" font-weight="600" letter-spacing="0.06em" fill="#5b6661">SCREEN</text>
  <text x="280" y="132" font-size="22" font-weight="650" fill="#0f1a17">3,713</text>
  <text x="280" y="152" font-size="11.5" fill="#5b6661" font-family="'Geist Mono', Consolas, monospace">enforcement events only</text>

  <!-- 3 merge -->
  <rect x="508" y="76" width="184" height="88" rx="6" fill="#fff" stroke="#c9d0cc"/>
  <rect x="520" y="88" width="50" height="18" rx="2" fill="#eef1ef"/>
  <text x="545" y="101" text-anchor="middle" font-size="10" font-weight="600" letter-spacing="0.06em" fill="#5b6661">MERGE</text>
  <text x="520" y="132" font-size="22" font-weight="650" fill="#0f1a17">2,206</text>
  <text x="520" y="152" font-size="11.5" fill="#5b6661" font-family="'Geist Mono', Consolas, monospace">cases, 65 countries</text>

  <!-- 4 grade (focal) -->
  <rect x="748" y="76" width="184" height="88" rx="6" fill="#fff" stroke="#d6453d" stroke-width="1.5"/>
  <rect x="760" y="88" width="50" height="18" rx="2" fill="#fbe9e7"/>
  <text x="785" y="101" text-anchor="middle" font-size="10" font-weight="600" letter-spacing="0.06em" fill="#a3322b">GRADE</text>
  <text x="760" y="128" font-size="12.5" fill="#0f1a17">1,546 single report</text>
  <text x="760" y="144" font-size="12.5" fill="#0f1a17">369 corroborated</text>
  <text x="760" y="160" font-size="12.5" fill="#0f1a17">291 official</text>

  <!-- 5 audits -->
  <rect x="748" y="196" width="184" height="72" rx="6" fill="#fff" stroke="#c9d0cc"/>
  <rect x="760" y="206" width="52" height="18" rx="2" fill="#eef1ef"/>
  <text x="786" y="219" text-anchor="middle" font-size="10" font-weight="600" letter-spacing="0.06em" fill="#5b6661">CHECK</text>
  <text x="760" y="242" font-size="12.5" fill="#0f1a17">precision 96.5% (blind)</text>
  <text x="760" y="258" font-size="12.5" fill="#0f1a17">recall about 1 in 5</text>

  <text x="28" y="40" font-size="15" font-weight="650" fill="#0f1a17">From public reports to graded cases</text>
  <text x="28" y="58" font-size="11.5" fill="#5b6661">WildTrace build of 20 October 2026. Counts are reports collected, not the true incidence of the crime.</text>
</svg>
